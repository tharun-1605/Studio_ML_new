version: '3.8'

services:
  ml-nginx:
    image: nginx:alpine
    container_name: ml-nginx
    ports:
      # Exposing the ML project on port 8080 of the server
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ml-frontend
      - ml-backend
    restart: unless-stopped

  ml-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Internal port only, mapped through ml-nginx
    depends_on:
      - ml-backend
    restart: unless-stopped

  ml-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://ml-mongodb:27017/
      # The public URL for generated WhatsApp photo links. Update this with your production domain/IP if needed.
      - API_PUBLIC_URL=http://localhost:8080/api/photos
    depends_on:
      - ml-mongodb
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  ml-mongodb:
    image: mongo:latest
    # Internal port only. Avoids conflict on host port 27017.
    volumes:
      - ml_mongodb_data:/data/db
    restart: unless-stopped

volumes:
  ml_mongodb_data:
